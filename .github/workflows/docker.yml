name: Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # GHCR requires a lowercase image path; repository names may have capitals.
      - name: Compute image reference
        id: image
        run: |
          name="${GITHUB_REPOSITORY,,}"
          echo "ref=${REGISTRY}/${name}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.ref }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,mode=max,scope=brokey-image
          cache-to: type=gha,mode=max,scope=brokey-image
