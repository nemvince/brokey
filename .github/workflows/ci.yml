name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun fmt --check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build single-file binary
        run: bun run build

      # The build embeds drizzle migrations; a stale generated module means
      # someone changed drizzle/ without rerunning `bun run db:generate`.
      - name: Verify embedded migrations are up to date
        run: git diff --exit-code -- src/server/migrations.generated.ts

  docker:
    name: Docker build
    # main pushes are built by the Docker image workflow; validate on PRs instead.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Builds the image without pushing so a broken Dockerfile fails the PR.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha,mode=max,scope=brokey-image
          cache-to: type=gha,mode=max,scope=brokey-image
